server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # 개발 환경의 Vite 프록시(/api -> :3000)와 같은 역할.
  # 백엔드에 CORS 설정이 없으므로 브라우저가 같은 출처(/api)로 호출하게 한다.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: 알 수 없는 경로는 index.html 로 (vue-router history 모드 새로고침 대응)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
