services:
  backend:
    build: ./backend
    environment:
      # 기본은 JSON 파일 DB(아래 볼륨에 저장). Oracle 을 쓰려면 실행할 때 환경 변수로 넘긴다.
      #   예) DB_TYPE=oracle ORACLE_USER=... ORACLE_PASSWORD=... ORACLE_CONNECT_STRING=host:1521/FREEPDB1 docker compose up -d --build
      DB_TYPE: ${DB_TYPE:-json}
      ORACLE_USER: ${ORACLE_USER:-}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-}
      ORACLE_CONNECT_STRING: ${ORACLE_CONNECT_STRING:-}
      # 로그인: 운영에서는 JWT_SECRET(16자 이상)과 강사 계정을 반드시 지정한다
      JWT_SECRET: ${JWT_SECRET:-}
      INSTRUCTOR_ID: ${INSTRUCTOR_ID:-admin}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD:-admin1234}
      # 예약 가능 기간(일): 지금부터 이 일수 이내의 방문 시간만 신청할 수 있다
      BOOKING_MAX_DAYS_AHEAD: ${BOOKING_MAX_DAYS_AHEAD:-3}
      # 로그인 시도 제한: 연속 실패 허용 횟수와 잠금 시간(분)
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-5}
      # 자습실 사진 저장소(SeaweedFS Filer). 같은 compose 안의 seaweedfs 컨테이너를 가리킨다
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
    volumes:
      # JSON DB(db.json)를 named volume 에 보관 -> 컨테이너를 다시 만들어도 데이터 유지
      - db-data:/app/data
    depends_on:
      - seaweedfs
    restart: unless-stopped

  # 자습실 사진 파일 저장소. master + volume + filer 를 한 컨테이너로 띄운다 (외부에 포트를 열지 않는다: 백엔드만 접근)
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -filer -dir=/data -master.volumeSizeLimitMB=256 -volume.max=8
    volumes:
      - seaweed-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 호스트 포트는 WEB_PORT 로 바꿀 수 있다 (기본 8080). 예: WEB_PORT=8081 docker compose up -d
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  seaweed-data:
