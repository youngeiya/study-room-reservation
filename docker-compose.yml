services:
  backend:
    build: ./backend
    volumes:
      # JSON DB(db.json)를 named volume 에 보관 -> 컨테이너를 다시 만들어도 데이터 유지
      - db-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # 호스트 포트는 WEB_PORT 로 바꿀 수 있다 (기본 8080). 예: WEB_PORT=8081 docker compose up -d
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
